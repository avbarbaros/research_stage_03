# =============================================================================
# Stage 3 — Multimodal Chain-of-Thought and Compositional Reasoning
# Single configuration file for setup.py and every E3_* experiment script.
#
# Any value can be overridden from the command line without editing this file:
#   python E3_1_mcot_baseline.py --set E3_1.max_samples=200 --set common.model.backend=hf
# =============================================================================

common:
  seed: 42
  output_root: /content/drive/MyDrive/MMRM/research_stage_03            # each experiment writes to <output_root>/<EXP>/<run_name>/
  # Where Hugging Face caches models and datasets. On Colab, point this at Google
  # Drive (e.g. /content/drive/MyDrive/hf_cache) so the ~16 GB of weights survive
  # a runtime reset. null = default (~/.cache/huggingface).
  hf_cache_dir: null

  model:
    name: Qwen/Qwen2.5-VL-7B-Instruct
    backend: vllm                 # vllm (fast, recommended on L4) | hf (plain transformers)
    dtype: bfloat16
    # --- image resolution (Qwen2.5-VL dynamic resolution; 1 visual token = 28x28 px) ---
    min_pixels: 200704            # 256 * 28 * 28
    max_pixels: 1003520           # 1280 * 28 * 28 (ScienceQA images are small; this rarely binds)
    # --- vLLM-only ---
    max_model_len: 8192
    gpu_memory_utilization: 0.90
    enforce_eager: false          # true = no CUDA graphs: slower, but saves ~1-2 GB and starts faster
    max_num_seqs: 64
    # --- hf-only ---
    hf_batch_size: 8
    attn_implementation: sdpa     # sdpa | flash_attention_2 (needs flash-attn installed)

  datasets:
    scienceqa:
      hf_id: derek-thomas/ScienceQA
      download_splits: [test]
    mathvista:
      hf_id: AI4Math/MathVista
      download_splits: [testmini]
    countbench:
      hf_id: vikhyatk/CountBenchQA
      download_splits: [test]
    refcoco:
      hf_id: lmms-lab-encoder/RefCOCO   # formerly lmms-lab/RefCOCO; bbox is [x, y, w, h] in original pixels
      download_splits: [val]            # ~1.1 GB
    gqa:
      hf_id: lmms-lab-encoder/GQA       # formerly lmms-lab/GQA; questions and images are separate configs
      download_configs: [[testdev_balanced_instructions, testdev], [testdev_balanced_images, testdev]]
    cvbench:
      hf_id: nyu-visionx/CV-Bench
      download_splits: [test]
    vstar:
      hf_id: craigwu/vstar_bench        # images are separate files in the repo (downloaded by the loader)
      download_splits: [test]

# -----------------------------------------------------------------------------
# setup.py
# -----------------------------------------------------------------------------
setup:
  # Installed with pip, in order. vLLM brings its own matching torch build;
  # installing it first and transformers after keeps the two compatible.
  packages:
    - "vllm>=0.8.5"
    - "transformers>=4.51.0"
    - "accelerate>=1.3.0"
    - "qwen-vl-utils>=0.0.10"
    - "datasets>=3.0.0"
    - "huggingface_hub>=0.30.0"
    - "pillow"
    - "pyyaml"
    - "numpy"
    - "scipy"
    - "pandas"
    - "tqdm"
  download_model: true
  download_datasets: [scienceqa, mathvista, countbench, refcoco, gqa, cvbench, vstar]
  extra_models:                   # tool models used by E3.3 (downloaded only)
    - IDEA-Research/grounding-dino-tiny
    - depth-anything/Depth-Anything-V2-Small-hf

# -----------------------------------------------------------------------------
# E3.1 — MCoT baseline: two-stage rationale-then-answer vs direct answering
# -----------------------------------------------------------------------------
E3_1:
  run_name: null                  # null = timestamp. Reuse a name to resume an interrupted run.
  split: test                     # train | validation | test  (test = 4,241 items)
  image_only: true               # true = only items with an image (~2,017 of the test split)
  max_samples: null               # null = whole split; set e.g. 200 for a quick check
  sample_seed: 42                 # used only when max_samples subsamples the split

  # Conditions to run (any subset, in any order):
  #   direct           image + question -> option letter
  #   cot              one call: "think step by step", then the answer (zero-shot CoT control)
  #   two_stage        Zhang et al. 2023: call 1 writes a rationale, call 2 answers given the rationale
  #   two_stage_noimg  as two_stage, but call 2 does not see the image (does the answer follow the rationale alone?)
  #   oracle           call 2 gets ScienceQA's gold `solution` as the rationale (upper bound for rationale quality)
  # two_stage_noimg reuses the rationales from two_stage, so two_stage must also be listed.
  conditions: [direct, cot, two_stage, two_stage_noimg, oracle]
  baseline_condition: direct      # every other condition is compared against this one

  include_lecture: false          # add ScienceQA's `lecture` field to the context (the paper's QCM->LE setting uses no lecture at input)
  chunk_size: 256                 # requests written to disk per chunk; a crash loses at most one chunk

  generation:                     # temperature 0 = greedy (deterministic)
    answer:    {max_new_tokens: 64,  temperature: 0.0, top_p: 1.0}   # direct and stage-2 calls (16 truncated 2% of stage-2 answers in full_img)
    rationale: {max_new_tokens: 512, temperature: 0.0, top_p: 1.0}   # stage-1 calls
    cot:       {max_new_tokens: 768, temperature: 0.0, top_p: 1.0}   # single-call CoT

  # Reuse parts of an earlier run (a sibling directory under <output_root>/E3_1/).
  # Used to re-run only the answer calls after changing generation.answer:
  #   python E3_1_mcot_baseline.py --set E3_1.run_name=full_img_a64 --set E3_1.reuse.from_run=full_img
  reuse:
    from_run: null                # null = generate everything
    rationales: true              # two_stage takes stage-1 rationales from that run (generates only missing ones)
    copy_conditions: [cot]        # prediction files copied unchanged (cot is unaffected by generation.answer)

  analysis:
    bootstrap_samples: 2000
    alpha: 0.05                   # significance level for the helps/hurts/neutral verdict
    extra_pairs:                  # [a, b]: paired test of b against a, reported as b - a
      - [two_stage_noimg, two_stage]   # does stage 2 use the image?
      - [cot, two_stage]               # one call vs two calls
      - [two_stage, oracle]            # headroom from a better rationale

  # Prompt templates. Available fields: {question} {context} {options}
  # and, in answer_with_rationale only, {rationale}.
  prompts:
    system: null                  # null = model default system prompt
    direct: |-
      Question: {question}
      Context: {context}
      Options: {options}
      Answer with the option's letter from the given choices directly.
    cot: |-
      Question: {question}
      Context: {context}
      Options: {options}
      Think step by step, using the image and the context. Then finish with a final line of the form "The answer is (X)." where X is the option letter.
    rationale: |-
      Question: {question}
      Context: {context}
      Options: {options}
      Write a short step-by-step solution that explains how to answer the question, based on the image and the context. Write only the reasoning; do not state which option letter is correct.
    answer_with_rationale: |-
      Question: {question}
      Context: {context}
      Options: {options}
      Solution: {rationale}
      Using the solution above, answer with the option's letter from the given choices directly.

# -----------------------------------------------------------------------------
# E3.2 — CoT harm audit: direct vs CoT prompting across four task families
# -----------------------------------------------------------------------------
E3_2:
  run_name: null                  # null = timestamp. Reuse a name to resume an interrupted run.
  conditions: [direct, cot]
  baseline_condition: direct
  run_families: [math, science, counting, grounding]   # any subset of the keys below

  # One dataset per family. max_samples: null = whole split; sampling is seeded.
  families:
    math:
      dataset: mathvista
      split: testmini             # 1,000 items: multiple choice + integer / float / list / text answers
      max_samples: null
      sample_seed: 42
    science:
      dataset: scienceqa
      split: test                 # image items only (2,017); subsampled to match the other families
      max_samples: 1000
      sample_seed: 42
    counting:
      dataset: countbench
      split: test                 # 491 items, counts 2-10
      max_samples: null
      sample_seed: 42
    grounding:
      dataset: refcoco
      split: val                  # 8,811 objects; scored as Acc@IoU>=iou_threshold
      max_samples: 1000
      sample_seed: 42
      expression_index: 0         # which of the object's referring expressions is used as the query

  iou_threshold: 0.5
  chunk_size: 256

  generation:                     # temperature 0 = greedy (deterministic)
    direct: {max_new_tokens: 128,  temperature: 0.0, top_p: 1.0}   # room for a JSON box; letters stop early
    cot:    {max_new_tokens: 1024, temperature: 0.0, top_p: 1.0}

  analysis:
    bootstrap_samples: 2000
    alpha: 0.05
    examples_per_family: 25       # CoT-loss examples (direct right, CoT wrong) saved for reading
    rescore: true                 # re-apply the current answer parser to saved outputs at analysis time
    min_reasoning_words: 15       # an output "contains reasoning" if it has at least this many words of prose

  # Prompt templates, one pair per answer kind.
  #   mc:   {question} {options}        (ScienceQA, MathVista multiple choice)
  #   open: {question} {format}         (MathVista free-form, CountBench); {format} e.g. "an integer"
  #   bbox: {question} = referring expression (RefCOCO); Qwen2.5-VL's native grounding phrasing
  # The cot variants differ from direct only in the reasoning instruction and the final-answer line.
  prompts:
    system: null
    mc:
      direct: |-
        {question}
        Options: {options}
        Answer with the option's letter from the given choices directly.
      cot: |-
        {question}
        Options: {options}
        Think step by step. Then finish with a final line of the form "The answer is (X)." where X is the option letter.
    open:
      direct: |-
        {question}
        Answer with {format} only.
      cot: |-
        {question}
        Think step by step. Then finish with a final line of the form "The answer is N." where N is {format}.
    bbox:
      direct: |-
        Locate "{question}" in the image and output its bbox coordinates in JSON format.
      # The plain "think step by step" variant was ignored in the 30-item check (CoT output = bare JSON,
      # identical to direct). This version asks for written reasoning before the JSON.
      cot: |-
        Locate "{question}" in the image.
        Before giving the box, reason step by step in plain sentences: list the objects in the image that could match the description, and explain which one matches its category, attributes and position relative to other objects.
        Only after this reasoning, output the bbox coordinates of the matching object in JSON format.

# -----------------------------------------------------------------------------
# E3.3 — Visual programs (ViperGPT-style agent) vs end-to-end prompting
# -----------------------------------------------------------------------------
E3_3:
  run_name: null
  # The VLM shares the L4 (22.0 GiB usable) with the detector and depth model.
  # The check run at 0.82 with CUDA graphs left 0.26 GiB free (vLLM process 19.5 GiB:
  # graphs and CUDA context are outside its budget) and Grounding DINO ran out of memory.
  # Eager mode + 0.80 leaves ~3.5 GiB for the tools. If vLLM reports too little KV-cache
  # memory at start-up, raise gpu_memory_utilization to 0.82.
  model_overrides:
    gpu_memory_utilization: 0.80
    enforce_eager: true
    max_model_len: 4096
    max_num_seqs: 16

  run_benchmarks: [gqa, cvbench]
  benchmarks:
    gqa:
      dataset: gqa
      split: testdev              # testdev-balanced: 12,578 questions over 398 images
      max_samples: 1000
      sample_seed: 42
    cvbench:
      dataset: cvbench
      split: test
      tasks: [Count, Relation, Depth, Distance]   # 788 / 650 / 600 / 600 items
      max_per_task: 250
      sample_seed: 42

  tools:
    device: cuda
    detector:
      model: IDEA-Research/grounding-dino-tiny
      box_threshold: 0.35
      text_threshold: 0.25
      nms_iou: 0.5
      max_detections: 20
      max_side: 1024              # images are downscaled to this before detection (bounds GPU memory)
    depth:
      model: depth-anything/Depth-Anything-V2-Small-hf
    query:                        # crop-and-requery: the VLM asked about a cropped region
      max_new_tokens: 16
      crop_margin: 0.1            # context added around a found box before asking
      min_crop_px: 32
      prompt: "{question} Answer with a single word or short phrase."
      marked_candidates: 5        # find_marked(): candidates checked for a drawn coloured outline
      marked_margin: 0.25         # extra context around a candidate so the drawn outline is visible

  planner:
    prompt_file: prompts/E3_3_planner.txt   # API description + worked examples; {question} {answer_format}
    sees_image: false             # classic ViperGPT: the program is written from the question alone
    max_new_tokens: 512
    temperature: 0.0

  executor:
    timeout_s: 60
    max_tool_calls: 30
    retry_error_types: [OutOfMemoryError]   # infrastructure failures: retried on resume, not counted as program errors
    # agent_fb: when a program fails (exception, timeout, no answer), use the direct answer instead.
    # Both the strict agent and agent_fb are always reported.

  generation:
    direct: {max_new_tokens: 32, temperature: 0.0, top_p: 1.0}

  analysis:
    bootstrap_samples: 2000
    alpha: 0.05
    examples_per_benchmark: 25    # random (seeded) agent losses and wins saved with code + trace
    example_seed: 0
    # Runs whose outputs were read while revising the planner prompt. Their items are
    # also reported excluded from the main comparison (sensitivity check against tuning).
    dev_runs: [check, check2]

  # E3_3_marked_eval.py: instance selection on CV-Bench 3D vs the gold boxes (no VLM)
  marked_eval:
    iou_threshold: 0.5            # a chosen box is the highlighted object if IoU >= this with the gold box
    border_px: 3                  # band along a gold box's edges where its drawn outline colour is read
    color_min_frac: 0.25          # minimum share of outline pixels of one colour to accept it
    oracle_depth: true            # also apply the agent's depth rules to the gold boxes (needs Depth Anything)
    device: cuda                  # cpu works too (slower)
    group_by:                     # subsets reported per benchmark (keys stored with each item)
      gqa: [structural, semantic, spatial]
      cvbench: [task]

  prompts:
    system: null
    direct_open: |-
      {question}
      Answer the question using a single word or phrase.
    direct_mc: |-
      {question}
      Options: {options}
      Answer with the option's letter from the given choices directly.

# -----------------------------------------------------------------------------
# E3.4 — Visual Sketchpad: re-observing a modified image mid-reasoning
# -----------------------------------------------------------------------------
E3_4:
  run_name: null
  # Several images per conversation + detector + depth model on the same L4.
  model_overrides:
    gpu_memory_utilization: 0.80
    enforce_eager: true
    max_model_len: 10240          # 8192 in the first pilot; raised for larger zoom images
    max_num_seqs: 16
    max_images_per_prompt: 6      # first image + up to max_actions result images

  run_benchmarks: [mathvista_geo, cvbench, vstar]
  benchmarks:
    mathvista_geo:
      dataset: mathvista
      split: testmini
      only_subgroups: [geometry problem solving]   # 208 items
      max_samples: null
      sample_seed: 42
    cvbench:                      # the same 1,000 items as E3.3 (paired comparison with the E3.3 agent)
      dataset: cvbench
      split: test
      tasks: [Count, Relation, Depth, Distance]
      max_per_task: 250
      sample_seed: 42
    vstar:
      dataset: vstar
      split: test                 # 191 items: direct_attributes, relative_position
      max_samples: null
      sample_seed: 42

  # direct and text are always run. Each sketch condition offers a set of action families:
  #   zoom | mark (detector overlay) | draw (draw_line / draw_point) | depth (depth map)
  conditions: [direct, text, sketch]
  action_sets:
    sketch: [zoom, mark, draw, depth]
    zoom_only: [zoom]
    mark_only: [mark]
    draw_only: [draw]
    depth_only: [depth]
  # Single-action ablations: run only on benchmarks listed here (fill in after the main run,
  # for benchmarks where sketch beats text), e.g. --set "E3_4.run_ablations_on=[vstar]"
  run_ablations_on: []
  ablation_conditions: [zoom_only, mark_only, draw_only, depth_only]

  sketchpad:
    max_actions: 4
    added_max_pixels: 401408      # mark / draw / depth result images: at most this many pixels (~512 visual tokens)
    zoom_max_pixels: 802816       # zoom results (~1024 tokens): a zoom into <= half the image then shows MORE detail than the original
    zoom_max_area_frac: 0.5       # guard: zooms covering more of the image are refused (they show nothing new)
    zoom_min_px: 64               # zoom regions smaller than this (original pixels) are grown around their centre
    zoom_max_upscale: 4.0
    mark_max: 9                   # numbered boxes drawn by mark()
    save_action_images: true      # result images saved (JPEG) under <run>/action_images/ for inspection
    image_quality: 70
    after_action: "Continue reasoning. Use another action if you need to, or finish with the ANSWER line."
    force_final: "You cannot use more actions. Finish now with the final line: ANSWER: {answer_hint}"
    force_retry: "Do not write ACTION any more. Reply with only the final line: ANSWER: {answer_hint}"
    chunk_size: 128

  tools:
    device: cuda
    detector:
      model: IDEA-Research/grounding-dino-tiny
      box_threshold: 0.35
      text_threshold: 0.25
      nms_iou: 0.5
      max_detections: 20
      max_side: 1024
    depth:
      model: depth-anything/Depth-Anything-V2-Small-hf

  generation:
    direct: {max_new_tokens: 32,  temperature: 0.0, top_p: 1.0}
    turn:   {max_new_tokens: 768, temperature: 0.0, top_p: 1.0}   # each reasoning turn (text and sketch)

  prompts:
    system: null
    direct_mc: |-
      {question}
      Options: {options}
      Answer with the option's letter from the given choices directly.
    direct_open: |-
      {question}
      Answer with {format} only.
    sketch_file: prompts/E3_4_sketchpad.txt   # {question} {options_block} {action_list} {max_actions} {width} {height} {answer_hint}
    text_file: prompts/E3_4_text.txt          # same structure without actions: the control condition

  analysis:
    bootstrap_samples: 2000
    alpha: 0.05
    examples_per_benchmark: 25    # random (seeded) sketch-vs-text wins and losses saved with all turns
    example_seed: 0
    group_by: {mathvista_geo: [answer_type], cvbench: [task], vstar: [subgroup]}
    dev_runs: [check, check2]     # pilot runs whose items were read while revising prompts (sensitivity check)
    e3_3_run: full                # E3.3 run for the CV-Bench comparison with the visual-program agent
    grounding_check: true         # CV-Bench 3D: did zoom/mark cover the highlighted objects? (reads gold boxes)
    cover_frac: 0.5               # a zoom covers an object if it contains >= this share of the object's gold box
    iou_threshold: 0.5            # a mark detection is the object if IoU >= this with the gold box
